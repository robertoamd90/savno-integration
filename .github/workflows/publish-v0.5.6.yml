name: Publish v0.5.6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.5.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.5.6 --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "v0.5.6 - Midnight refresh" --notes "Refresh delle entita dipendenti dalla data a mezzanotte senza richieste SAVNO aggiuntive. Polling invariato ogni tre ore. Versione e cache frontend aggiornate a 0.5.6."
